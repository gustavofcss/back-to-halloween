<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07050d">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Horror Night Party{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/pumpkin.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=VT323&family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  {% with mensagens = get_flashed_messages() %}
    {% if mensagens %}
      <div class="flash-wrap" role="status" aria-live="polite">
        {% for mensagem in mensagens %}<div class="flash">{{ mensagem }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/comum.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/vhs.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
