services:
  - type: web
    name: horror-night-party
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd app && gunicorn app:app"
    envVars:
      # Já existe um Postgres criado manualmente no Render com os dados reais
      # (evento, hierarquia do admin, pedido de teste) -- por isso não tem
      # bloco `databases:` provisionando um banco novo aqui. Cole a mesma
      # "External Database URL" que já está no .env local.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PIX_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: LINK_PAGAMENTO_30
        sync: false
      - key: LINK_PAGAMENTO_60
        sync: false
