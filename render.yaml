databases:
  - name: horror-night-db
    plan: free
    databaseName: horror_night
    user: horror_night

services:
  - type: web
    name: horror-night-party
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd app && gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: horror-night-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PIX_KEY
        sync: false
      - key: BASE_URL
        sync: false
