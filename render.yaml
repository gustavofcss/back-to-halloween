services:
  - type: web
    name: horror-night-party
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # 2 workers x 4 threads: a conciliação do Pix chama a API do Mercado Pago
    # (até 15s) a cada polling, e com 1 worker síncrono alguns clientes na tela
    # de pagamento travavam o site inteiro. O Start Command do painel do Render
    # tem que ser igual a este.
    startCommand: "cd app && gunicorn app:app --workers 2 --threads 4 --timeout 30"
    envVars:
      # O runtime Python padrão do Render virou a 3.14, e o psycopg2-binary
      # 2.9.9 não tem wheel compilado pra ela ainda (ImportError: undefined
      # symbol _PyInterpreterState_Get ao importar). Trava numa versão
      # estável com suporte garantido.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Já existe um Postgres criado manualmente no Render com os dados reais
      # (evento, hierarquia do admin, pedido de teste) -- por isso não tem
      # bloco `databases:` provisionando um banco novo aqui. Cole a mesma
      # "External Database URL" que já está no .env local.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NOME
        sync: false
      # Uma chave Pix por valor de pedido (ver config.PIX_KEYS).
      - key: PIX_KEY_30
        sync: false
      - key: PIX_KEY_60
        sync: false
      - key: PIX_KEY_50
        sync: false
      - key: BASE_URL
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
